name: Sender release WIP
run-name: sender-recovery-${{ inputs.source || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Exact first-parent master source to build or recover'
        required: false
        type: string
      confirm_build:
        description: 'Explicitly authorize compilation and packaging'
        type: boolean
        required: true
        default: false
      confirm_publish:
        description: 'Separately authorize public release of the selected source'
        type: boolean
        required: true
        default: false
      build_only:
        description: 'Build private artifacts without preparing or publishing a Public release (requires source)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit authorization
        env:
          CONFIRM_BUILD: ${{ inputs.confirm_build }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          BUILD_ONLY: ${{ inputs.build_only }}
          SOURCE: ${{ inputs.source }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = refs/heads/master || { echo 'Use master' >&2; exit 1; }
          test -n "$SOURCE" || { echo 'Select an exact source' >&2; exit 1; }
          test "$CONFIRM_BUILD" = true || { echo 'Explicit build confirmation required' >&2; exit 1; }
          if [ "$BUILD_ONLY" != true ] && [ "$CONFIRM_PUBLISH" != true ]; then
            echo 'Explicit public release confirmation required' >&2; exit 1
          fi

  version:
    needs: authorization
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source identity and derive version
        id: identity
        env:
          SOURCE: ${{ inputs.source || github.sha }}
          MASTER: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MASTER"
          VERSION=$(python3 scripts/release_version.py --master "$MASTER" "$SOURCE")
          printf '%s\n' "source=$SOURCE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "version=$VERSION" >> "$GITHUB_OUTPUT"
  preflight:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    needs: version
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publisher prerequisite before expensive builds
        env:
          SOURCE: ${{ needs.version.outputs.source }}
          MASTER: ${{ github.sha }}
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
        run: python3 scripts/release_controller.py preflight --master "$MASTER" --source "$SOURCE" --require-publish

  checks:
    needs: [version, preflight]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.preflight.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_only && needs.preflight.result == 'skipped')) }}
    uses: ./.github/workflows/ci.yml
    with:
      source: ${{ needs.version.outputs.source }}

  linux-build:
    needs: [version, checks, preflight]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.checks.result == 'success' && (needs.preflight.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_only && needs.preflight.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64]
    uses: ./.github/workflows/sender-linux-build.yml
    with:
      source: ${{ needs.version.outputs.source }}
      version: ${{ needs.version.outputs.version }}
      platform: ${{ matrix.platform }}

  windows-build:
    needs: [version, checks, preflight]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.checks.result == 'success' && (needs.preflight.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_only && needs.preflight.result == 'skipped')) }}
    uses: ./.github/workflows/protected-windows-package.yml
    with:
      source: ${{ needs.version.outputs.source }}
      version: ${{ needs.version.outputs.version }}

  prepare:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
    needs: [version, checks, linux-build, windows-build]
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    concurrency:
      group: sender-prepare-${{ needs.version.outputs.source }}
      queue: max
    env:
      SOURCE: ${{ needs.version.outputs.source }}
      VERSION: ${{ needs.version.outputs.version }}
      MASTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-linux-x64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/x64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-linux-arm64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/arm64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-windows-x64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/windows
      - name: Assemble exact source-bound asset set
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/assets" "$RUNNER_TEMP/evidence"
          python3 -c '
          import os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          sets={"x64": ["sender-linux-x64.tar.gz"], "arm64": ["sender-linux-arm64.tar.gz"], "windows": ["sender-windows-x64.zip", "validate_sender_package.ps1", "activate_sender_package.ps1"]}
          for platform,names in sets.items():
              source=root/platform
              assert source.is_dir() and not source.is_symlink()
              for p in source.rglob("*"):
                  assert not p.is_symlink() and (p.is_file() or p.is_dir())
              assert {p.name for p in (source/"assets").iterdir()} == set(names) | {n+".sha256" for n in names}
              assert {p.name for p in (source/"evidence").iterdir()} == {"linux-x64" if platform == "x64" else "linux-arm64" if platform == "arm64" else "windows-x64"}
          '
          for platform in x64 arm64 windows; do
            cp -a "$RUNNER_TEMP/$platform/assets/." "$RUNNER_TEMP/assets/"
            cp -a "$RUNNER_TEMP/$platform/evidence/." "$RUNNER_TEMP/evidence/"
          done
          git show "$SOURCE:bootstrap.sh" > "$RUNNER_TEMP/assets/install.sh"
          git show "$SOURCE:bootstrap.ps1" > "$RUNNER_TEMP/assets/install.ps1"
          (cd "$RUNNER_TEMP/assets"; sha256sum install.sh > install.sh.sha256; sha256sum install.ps1 > install.ps1.sha256)
          python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "assets/version.json").write_text(json.dumps({"source":os.environ["SOURCE"],"version":os.environ["VERSION"]})+"\n")'
      - name: Inspect all platforms and stage a draft
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
        run: python3 scripts/release_controller.py prepare --master "$MASTER" --source "$SOURCE" --assets "$RUNNER_TEMP/assets" --evidence "$RUNNER_TEMP/evidence"

  publisher:
    needs: [version, prepare]
    if: ${{ needs.prepare.result == 'success' && inputs.confirm_publish && !inputs.build_only }}
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    concurrency:
      group: sender-publisher
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconcile validated READY drafts
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
          SOURCE: ${{ needs.version.outputs.source }}
        run: python3 scripts/release_controller.py drain --source "$SOURCE"
